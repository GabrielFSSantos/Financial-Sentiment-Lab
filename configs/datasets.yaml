# Datasets (schema 2.0). enabled: true entra na matriz; paths relativos à raiz.

schema_version: "2.0"

defaults:
  language: pt
  format: csv
  reader:
    encoding: utf-8
    delimiter: ","
    quotechar: '"'
    header: 0
    low_memory: false
    skip_blank_lines: true
    on_bad_lines: error
  validation:
    strip_text: true
    drop_empty_texts: true
    fail_on_duplicate_ids: true
    preserve_extra_columns: true
  labels:
    available: false
    normalize_case: true
    strip_whitespace: true
    mapping: {}
  dates:
    available: false
    format: null
    dayfirst: false
    fail_on_invalid: true
    output_format: "%Y-%m-%d"
  limits:
    # max = todas as linhas; inteiro >= 1 limita leitura e fetch amostrado
    max_rows: 200

datasets:

  # Exemplo PT com rótulos — validação técnica da pipeline
  noticias_exemplo_ptbr:
    enabled: true
    order: 1
    dataset_name: noticias_exemplo_ptbr
    display_name: Notícias financeiras de exemplo (PT-BR)
    path: data/noticias_exemplo_ptbr/noticias.csv
    format: csv
    limits:
      max_rows: max
    columns:
      news_id: id
      text: noticia
      date: data
      company: empresa
      sector: setor
      ticker: ticker
      title: titulo
      true_label: sentimento
      source: fonte
      url: url
    required_fields:
      - news_id
      - text
    labels:
      available: true
      normalize_case: true
      strip_whitespace: true
      mapping:
        positivo: POSITIVE
        positiva: POSITIVE
        positive: POSITIVE
        negativo: NEGATIVE
        negativa: NEGATIVE
        negative: NEGATIVE
        neutro: NEUTRAL
        neutra: NEUTRAL
        neutral: NEUTRAL
    dates:
      available: true
      format: "%Y-%m-%d"
      dayfirst: false
      fail_on_invalid: true
      output_format: "%Y-%m-%d"
    metadata:
      language: pt-BR
      domain: financial
      market: Brazilian
      country: Brazil
      split: test
      source_type: synthetic
      description: >-
        Dataset pequeno para validar carregamento, inferência, métricas e
        agregações da pipeline.

  news_example_en:
    enabled: true
    order: 2
    language: en
    dataset_name: news_example_en
    display_name: English financial news example
    path: data/news_example_en/news.csv
    format: csv
    limits:
      max_rows: max
    columns:
      news_id: id
      text: news_text
      date: date
      company: company
      sector: sector
      ticker: ticker
      title: title
      true_label: sentiment
      source: source
      url: url
    required_fields:
      - news_id
      - text
    labels:
      available: true
      normalize_case: true
      strip_whitespace: true
      mapping:
        positive: POSITIVE
        negative: NEGATIVE
        neutral: NEUTRAL
    dates:
      available: true
      format: "%Y-%m-%d"
      dayfirst: false
      fail_on_invalid: true
      output_format: "%Y-%m-%d"
    metadata:
      language: en
      domain: financial
      market: US
      country: United States
      split: test
      source_type: synthetic
      description: Exemplo EN com rótulos para validação da pipeline.

  saneamento_corpus:
    enabled: true
    order: 3
    dataset_name: saneamento_corpus
    display_name: Corpus de saneamento (scraper)
    path: data/saneamento_corpus/noticias.csv
    format: csv
    limits:
      max_rows: max
    columns:
      news_id: id
      text: noticia
      date: data
      company: empresa
      sector: setor
      ticker: ticker
      title: titulo
      true_label: null
      source: fonte
      url: url
    required_fields:
      - news_id
      - text
    labels:
      available: false
    dates:
      available: true
      format: "%Y-%m-%d"
      dayfirst: false
      fail_on_invalid: true
      output_format: "%Y-%m-%d"
    metadata:
      language: pt-BR
      domain: sanitation_utilities
      market: Brazilian
      country: Brazil
      split: inference
      source_type: scraper
      description: >-
        Corpus multiportal gerado por modules/scrapers; CSV versionado no repositório.
