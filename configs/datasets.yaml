# Datasets (schema 2.0). enabled: true entra na matriz; paths relativos à raiz.

schema_version: "2.0"

defaults:
  language: pt
  format: csv
  reader:
    encoding: utf-8
    delimiter: ","
    quotechar: '"'
    header: 0
    low_memory: false
    skip_blank_lines: true
    on_bad_lines: error
  validation:
    strip_text: true
    drop_empty_texts: true
    fail_on_duplicate_ids: true
    preserve_extra_columns: true
  labels:
    available: false
    normalize_case: true
    strip_whitespace: true
    mapping: {}
  dates:
    available: false
    format: null
    dayfirst: false
    fail_on_invalid: true
    output_format: "%Y-%m-%d"
  limits:
    # max = todas as linhas; inteiro >= 1 limita leitura e fetch amostrado
    max_rows: 200

datasets:

  # Exemplo PT com rótulos — validação técnica da pipeline
  noticias_exemplo:
    enabled: true
    order: 1
    dataset_name: noticias_exemplo
    display_name: Notícias financeiras de exemplo
    path: data/noticias_exemplo/noticias.csv
    format: csv
    limits:
      max_rows: max
    columns:
      news_id: id
      text: noticia
      date: data
      company: empresa
      sector: setor
      ticker: ticker
      title: titulo
      true_label: sentimento
      source: fonte
      url: url
    required_fields:
      - news_id
      - text
    labels:
      available: true
      normalize_case: true
      strip_whitespace: true
      mapping:
        positivo: POSITIVE
        positiva: POSITIVE
        positive: POSITIVE
        negativo: NEGATIVE
        negativa: NEGATIVE
        negative: NEGATIVE
        neutro: NEUTRAL
        neutra: NEUTRAL
        neutral: NEUTRAL
    dates:
      available: true
      format: "%Y-%m-%d"
      dayfirst: false
      fail_on_invalid: true
      output_format: "%Y-%m-%d"
    metadata:
      language: pt-BR
      domain: financial
      market: Brazilian
      country: Brazil
      split: test
      source_type: synthetic
      description: >-
        Dataset pequeno para validar carregamento, inferência, métricas e
        agregações da pipeline.

  ptbr_financial_news_dataset:
    enabled: true
    order: 2
    dataset_name: ptbr_financial_news_dataset
    display_name: PT-BR Financial News Dataset
    path: data/ptbr_financial_news_dataset/ptbr_financial_news_dataset.jsonl
    format: jsonl
    source:
      provider: huggingface_dataset
      repo_id: lucasalmda/pt-br-financial-news-dataset
      revision: main
      config: default
      split: train
      data_files: financial_news_br.jsonl
      materialize_format: jsonl
      local_path: data/ptbr_financial_news_dataset/ptbr_financial_news_dataset.jsonl
    columns:
      news_id: url
      text: sentiment_text
      date: published_at
      company: null
      sector: null
      ticker: null
      title: title
      true_label: null
      source: source
      url: url
    required_fields:
      - news_id
      - text
    labels:
      available: false
    dates:
      available: true
      format: ISO8601
      dayfirst: false
      fail_on_invalid: true
      output_format: "%Y-%m-%d"
    metadata:
      language: pt-BR
      domain: financial_news
      market: Brazilian
      country: Brazil
      split: inference
      source_type: real_news
      description: >-
        Notícias financeiras brasileiras (2016–2025), sem rótulos de
        sentimento.

  news_example_en:
    enabled: true
    order: 3
    language: en
    dataset_name: news_example_en
    display_name: English financial news example
    path: data/news_example_en/news.csv
    format: csv
    limits:
      max_rows: max
    columns:
      news_id: id
      text: news_text
      date: date
      company: company
      sector: sector
      ticker: ticker
      title: title
      true_label: sentiment
      source: source
      url: url
    required_fields:
      - news_id
      - text
    labels:
      available: true
      normalize_case: true
      strip_whitespace: true
      mapping:
        positive: POSITIVE
        negative: NEGATIVE
        neutral: NEUTRAL
    dates:
      available: true
      format: "%Y-%m-%d"
      dayfirst: false
      fail_on_invalid: true
      output_format: "%Y-%m-%d"
    metadata:
      language: en
      domain: financial
      market: US
      country: United States
      split: test
      source_type: synthetic
      description: Exemplo EN com rótulos para validação da pipeline.

  en_financial_news_dataset:
    enabled: true
    order: 4
    language: en
    dataset_name: en_financial_news_dataset
    display_name: EN Financial News Dataset (FNSPID Nasdaq)
    path: data/en_financial_news_dataset/nasdaq_exteral_data.csv
    format: csv
    source:
      provider: huggingface_dataset
      repo_id: Zihan1004/FNSPID
      revision: main
      config: default
      split: train
      data_files: Stock_news/nasdaq_exteral_data.csv
      materialize_format: csv
      local_path: data/en_financial_news_dataset/nasdaq_exteral_data.csv
    text_compose:
      template: "Title: {title}\nBody: {body}"
      fields:
        title: Article_title
        body: Article
      skip_if_all_empty: true
    columns:
      news_id: Url
      text: null
      date: Date
      company: null
      sector: null
      ticker: Stock_symbol
      title: Article_title
      true_label: null
      source: Publisher
      url: Url
    required_fields:
      - news_id
      - text
    labels:
      available: false
    dates:
      available: true
      format: null
      dayfirst: false
      fail_on_invalid: true
      output_format: "%Y-%m-%d"
    metadata:
      language: en
      domain: financial_news
      market: US
      country: United States
      split: inference
      source_type: real_news
      size_gb: 23
      citation: "FNSPID (Dong et al., 2024)"
      description: >-
        Fatia Nasdaq do FNSPID (~23 GB completo). Use limits.max_rows em
        pilotos.
