# Validação científica (schema 2.0). Research consome índices do experimento e preços via modules.market.

schema_version: "2.0"

defaults:
  horizons: [1, 5, 21]
  iti_column: iti_liquido
  iti_predictors: [iti_liquido, iti_risco]
  abs_return_predictors: [iti_risco]
  return_column: log_return
  return_mode: cumulative

experiment_run:
  run_id: null
  output_root: outputs
  model_key: null
  dataset_key: null

market:
  config_path: configs/market.yaml

mapping:
  company_to_ticker:
    Sabesp: SBSP3.SA
    Copasa: CSMG3.SA
    Sanepar: SAPR4.SA

validation:
  baselines: [b0, b1, b2, b3]
  metrics: [pearson, spearman, r2, mse]
  min_overlap_days: 10
  inference:
    enabled: true
    n_bootstrap: 500
    block_size: 5
    ci_level: 0.95
    random_seed: 42

paths:
  output_root: outputs
