schema_version: '2.0'
experiment:
  name: financial_sentiment
  description: Diagnóstico FinMarBa — concordância FinBERT × rótulo de mercado (Marco 5)
  run_id: null
  run_id_prefix: finmarba_diag
  random_seed: 42
  timezone: America/Sao_Paulo
execution:
  environment: local
  dry_run: false
  log_level: INFO
  fail_fast: true
  save_failure_artifacts: true
  overwrite_existing_run: true
  unload_model_after_combination: true
configuration_files:
  models: configs/models.yaml
  datasets: configs/datasets.yaml
paths:
  output_root: outputs
  log_root: logs
  temp_root: .tmp
outputs:
  save_predictions: true
  save_metrics: true
  save_aggregates: true
  save_metadata: true
  save_experiment_summary: true
  save_resolved_config: true
  tabular_format: csv
  encoding: utf-8
  delimiter: ','
  float_precision: 8
classification_metrics:
  enabled: true
  labels:
  - NEGATIVE
  - NEUTRAL
  - POSITIVE
  zero_division: 0
  allow_unlabeled_datasets: false
  save_per_class_metrics: true
  save_confusion_matrix: true
  save_class_distribution: true
performance_metrics:
  enabled: true
  measure_load_time: true
  measure_inference_time: true
  measure_total_time: true
  measure_throughput: true
  measure_gpu_memory: true
aggregation:
  enabled: false
  sentiment_column: continuous_sentiment
  minimum_news_per_group: 1
  skip_level_when_columns_missing: true
  levels:
    - company_day
  statistics:
    - mean
    - count
  include_class_counts: false
  include_mean_confidence: false
reproducibility:
  set_python_hash_seed: true
  seed_numpy: true
  seed_torch: true
  deterministic_torch: false
  cudnn_benchmark: true
compatibility:
  require_language_match: true
temporal_index:
  enabled: false
preflight_checks:
  enabled: true
  validate_model_files: true
  validate_dataset_files: true
  validate_output_directory: true
